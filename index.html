<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Composé</title>

  <!-- App-gedrag op iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Composé">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F0E8">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Thema direct toepassen, vóór de eerste weergave (voorkomt een flits) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('compose.theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Hoofdmenu">
    <a href="#/home" data-tab="home">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>
      <span>Home</span>
    </a>
    <a href="#/atelier" data-tab="atelier">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9"/><rect x="13" y="4" width="7" height="5"/><rect x="13" y="11" width="7" height="9"/><rect x="4" y="15" width="7" height="5"/></svg>
      <span>Atelier</span>
    </a>
    <a href="#/kast" data-tab="kast">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 5.5a2 2 0 1 1 2 2V9l8.4 6.4a1 1 0 0 1-.6 1.8H4.2a1 1 0 0 1-.6-1.8L12 9"/></svg>
      <span>Kast</span>

    <a href="#/wishlist" data-tab="wishlist">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
      <span>Wishlist</span>
    </a>
    <a href="#/budget" data-tab="budget">

    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
